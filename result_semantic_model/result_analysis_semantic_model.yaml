name: snoflake_monitor_results
description: "This semantic model can be used for asking questions over the snoflake_monitor_results data."
tables:
  - name: MONITORING_RESULTS
    synonyms:
      - Monitoring_Outcomes
      - Rule_Performance
      - Action_Reports
      - Rule_Status_Log
      - Performance_Reviews
    description: "\"Stores monitoring results for rules, including actions taken and timestamps.\""
    base_table:
      database: SNOWFLAKE_MONITORING
      schema: PUBLIC
      table: MONITORING_RESULTS
    primary_key:
      columns: []
    dimensions:
      - name: RULE_ID
        synonyms:
          - RuleKey
          - MonitoringRuleID
          - RuleReference
          - RuleCode
          - MonitoringRuleNumber
        description: "Unique identifier for each monitoring rule."
        expr: RULE_ID
        data_type: TEXT
      - name: MONITORING_TYPE
        synonyms:
          - Surveillance_Method
          - Tracking_Type
          - Monitoring_Mode
          - Observation_Type
          - Inspection_Method
        description: "Type of monitoring activity."
        expr: MONITORING_TYPE
        data_type: TEXT
      - name: CATEGORY
        synonyms:
          - Class
          - Group
          - Type
          - Classification
          - Subcategory
        description: "Category of monitored item."
        expr: CATEGORY
        data_type: TEXT
      - name: SUBCATEGORY
        synonyms:
          - Category
          - Subgroup
          - "Metric Type"
          - Segment
          - Class
        description: "Subcategory of monitored metric."
        expr: SUBCATEGORY
        data_type: TEXT
      - name: ACTIONS
        synonyms:
          - Steps
          - Initiatives
          - Measures
          - Undertakings
          - Decisions
        description: "Action taken during monitoring."
        expr: ACTIONS
        data_type: TEXT
      - name: ACTION_MESSAGE
        synonyms:
          - "Alert Text"
          - "System Notification"
          - "Monitoring Message"
          - "Event Description"
          - "Status Update"
        description: "Action message received from monitoring system."
        expr: ACTION_MESSAGE
        data_type: TEXT
      - name: ACTION_TAKEN
        synonyms:
          - StepsTaken
          - ResolutionAction
          - MonitoringOutcome
          - TeamAction
          - ResolutionSteps
        description: "Action taken by the monitoring team."
        expr: ACTION_TAKEN
        data_type: TEXT
      - name: RESOURCE_NAME
        synonyms:
          - "Asset Identifier"
          - "Resource Title"
          - "Entity Name"
          - "Item Label"
          - "Property Name"
        description: "Name of the monitored resource."
        expr: RESOURCE_NAME
        data_type: TEXT
      - name: RULE_RUN_TIMESTAMP
        synonyms:
          - RuleExecutionTime
          - RunTimestamp
          - RuleRunDate
          - ExecutionDateTime
          - RunTimeStamp
        description: "Timestamp of rule run."
        expr: RULE_RUN_TIMESTAMP
        data_type: TEXT
relationships:
custom_instructions: ""
